[project]
name = "seattle-energy-forecast"
version = "0.1.0"
description = "Learning project for Seattle building energy consumption prediction."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.3,<3.0",
    "pandas>=2.3,<3.0",
    "scikit-learn>=1.7,<2.0",
    "bentoml>=1.4.30,<2.0",
    "pydantic>=1.10,<2.0",
    "pandera>=0.26,<0.27",
    "requests>=2.31,<3.0",
    "scipy>=1.11.0,<2.0",
    "notebook>=6.5,<7.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
packages = [
  { include = "seattle_energy", from = "src" }
]
