service: "seattle_energy.service:EnergyService"
description: "Energy consumption prediction API for Seattle building benchmarking"
labels:
  owner: openclassrooms
  project: seattle-energy-forecast

include:
  - "src/seattle_energy/*.py"
  - "data/processed/*.csv"

models:
  - random_forest_energy:latest

python:
  packages:
    - scikit-learn
    - pandas
    - numpy
    - pydantic
    - pandera
    - bentoml==1.4.30
